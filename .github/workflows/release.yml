name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve tag and release notes
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      release_title: ${{ steps.notes.outputs.release_title }}
      release_kind: ${{ steps.notes.outputs.release_kind }}
      release_body: ${{ steps.notes.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG:-}" ]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG_NAME'. Expected vX.Y.Z"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Refresh tag refs even if a local tag with same name points elsewhere.
          # This avoids "would clobber existing tag" failures in workflow_dispatch reruns.
          git fetch --force --tags origin
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)

          CURRENT_VERSION="${TAG_NAME#v}"
          IFS='.' read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"

          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
            IFS='.' read -r PREVIOUS_MAJOR PREVIOUS_MINOR PREVIOUS_PATCH <<< "$PREVIOUS_VERSION"
          else
            PREVIOUS_VERSION="none"
            PREVIOUS_MAJOR=0
            PREVIOUS_MINOR=0
            PREVIOUS_PATCH=0
          fi

          RELEASE_KIND="Release"

          if [ "$PREVIOUS_VERSION" = "none" ]; then
            case "$CURRENT_VERSION" in
              0.1.0)
                RELEASE_KIND="Update"
                ;;
              0.0.1)
                RELEASE_KIND="Hotfix"
                ;;
              *)
                RELEASE_KIND="Release"
                ;;
            esac
          elif [ "$CURRENT_MAJOR" -gt "$PREVIOUS_MAJOR" ]; then
            RELEASE_KIND="Release"
          elif [ "$CURRENT_MINOR" -gt "$PREVIOUS_MINOR" ]; then
            RELEASE_KIND="Update"
          elif [ "$CURRENT_PATCH" -gt "$PREVIOUS_PATCH" ]; then
            RELEASE_KIND="Hotfix"
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$TAG_NAME"
          else
            RANGE="$TAG_NAME"
          fi

          SUBJECTS=$(git log "$RANGE" --pretty=format:'%s' || true)

          BREAKING=$(echo "$SUBJECTS" | grep -Ei '^[a-z]+(\([^)]+\))?!:|breaking change' | sed 's/^/- /' || true)
          FEATURES=$(echo "$SUBJECTS" | grep -Ei '^feat(\([^)]+\))?:' | sed 's/^/- /' || true)
          FIXES=$(echo "$SUBJECTS" | grep -Ei '^(fix|perf|refactor)(\([^)]+\))?:' | sed 's/^/- /' || true)
          DOCS=$(echo "$SUBJECTS" | grep -Ei '^docs(\([^)]+\))?:' | sed 's/^/- /' || true)
          CHORE=$(echo "$SUBJECTS" | grep -Ei '^chore(\([^)]+\))?:' | sed 's/^/- /' || true)
          CI=$(echo "$SUBJECTS" | grep -Ei '^ci(\([^)]+\))?:' | sed 's/^/- /' || true)
          BUILD_CHANGES=$(echo "$SUBJECTS" | grep -Ei '^build(\([^)]+\))?:' | sed 's/^/- /' || true)
          OTHERS=$(echo "$SUBJECTS" | grep -Eiv '^[a-z]+(\([^)]+\))?!:|breaking change|^feat(\([^)]+\))?:|^(fix|perf|refactor)(\([^)]+\))?:|^docs(\([^)]+\))?:|^chore(\([^)]+\))?:|^ci(\([^)]+\))?:|^build(\([^)]+\))?:' | sed '/^\s*$/d; s/^/- /' || true)

          if [ -z "$SUBJECTS" ]; then
            OTHERS='- Initial release'
          fi

          {
            echo "release_kind=$RELEASE_KIND"
            echo "release_title=Open Stop Motion Studio ${RELEASE_KIND} ${TAG_NAME}"
            echo "body<<EOF"
            echo "## Open Stop Motion Studio ${RELEASE_KIND} ${TAG_NAME}"
            echo
            echo "- Release type: ${RELEASE_KIND}"
            echo "- Previous version: ${PREVIOUS_VERSION}"
            echo "- Current version: ${CURRENT_VERSION}"
            echo
            if [ -n "$BREAKING" ]; then
              echo "### Breaking Changes"
              echo "$BREAKING"
              echo
            fi
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes and Improvements"
              echo "$FIXES"
              echo
            fi
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo
            fi
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo
            fi

            if [ -n "$CHORE$CI$BUILD_CHANGES" ]; then
              echo "### Technical Changes"
              echo
            fi
            if [ -n "$CHORE" ]; then
              echo "#### Maintenance"
              echo "$CHORE"
              echo
            fi
            if [ -n "$CI" ]; then
              echo "#### CI"
              echo "$CI"
              echo
            fi
            if [ -n "$BUILD_CHANGES" ]; then
              echo "#### Build System"
              echo "$BUILD_CHANGES"
              echo
            fi
            echo "### Build"
            echo "- .NET 10"
            echo "- Avalonia UI"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Publish binaries (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish OpenStopMotionStudio.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish-folder

      - name: Archive release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          $version = $env:TAG_NAME.Substring(1)
          $name = "OSMS-${{ matrix.rid }}-v$version.zip"
          Compress-Archive -Path ./publish-folder/* -DestinationPath $name

      - name: Archive release (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          tar -czf "OSMS-${{ matrix.rid }}-v${VERSION}.tar.gz" -C ./publish-folder .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            *.zip
            *.tar.gz

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
        run: |
          set -euo pipefail

          NOTES_FILE="$(mktemp)"
          printf '%s\n' "$RELEASE_BODY" > "$NOTES_FILE"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE"
          fi

          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG_NAME" "$file" --clobber
          done

      - name: Push changelog to Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CHANGELOG }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          RELEASE_KIND: ${{ needs.prepare.outputs.release_kind }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_CHANGELOG is empty; skipping changelog push."
            exit 0
          fi

          MESSAGE="${RELEASE_TITLE}\\nTag: ${TAG_NAME}\\nType: ${RELEASE_KIND}"
          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"content": os.environ["MESSAGE"]}))')
          curl -sS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null

      - name: Push release link to Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_RELEASE is empty; skipping release push."
            exit 0
          fi

          RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${TAG_NAME}"
          MESSAGE="${RELEASE_TITLE}\\n${RELEASE_URL}"
          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"content": os.environ["MESSAGE"]}))')
          curl -sS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null